<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Wars</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#171a18">
<style>
:root{--bg:#f3f1ea;--fg:#1f2421;--mut:#6d716b;--edge:#b4b6ab;--neu:#d3d5c8;--p1:#3f86d6;--p2:#d9534a;--card:#fff;--bd:#d4d6ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171a18;--fg:#e8ebe4;--mut:#9ca199;--edge:#4a4e48;--neu:#363a35;--p1:#5a9cf0;--p2:#ee6a5f;--card:#222622;--bd:#383d37}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171a18;--fg:#e8ebe4;--mut:#9ca199;--edge:#4a4e48;--neu:#363a35;--p1:#5a9cf0;--p2:#ee6a5f;--card:#222622;--bd:#383d37}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:10px 12px 24px}
h1{font-size:20px;margin:4px 0 2px}
#msg{min-height:44px;color:var(--mut);margin:0 0 6px}
svg{width:100%;max-height:68vh;display:block;touch-action:none;user-select:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
button.on{border-color:var(--p1);box-shadow:0 0 0 2px var(--p1)}
small{color:var(--mut)}
.editions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.editions a{color:inherit;display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
.editions a[aria-current="page"]{background:var(--card);font-weight:700}
.type-wheel{position:fixed;z-index:10;width:204px;height:204px;border-radius:50%;background:var(--card);border:2px solid var(--bd);box-shadow:0 8px 28px #0005;touch-action:none}
.type-wheel button{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;padding:0;border-radius:50%}
.type-wheel span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:.75rem;font-weight:700;text-align:center}
</style><link rel="stylesheet" href="./board-ui.css?v=21"></head><body><main>
<h1>Fruit Wars</h1>
<div id="production-cycle" class="production-cycle" role="group" aria-label="Production speed" hidden>
  <div class="production-pair"><strong>Active</strong><span id="production-active-buff" class="production-buff" role="img"></span><span id="production-active-debuff" class="production-debuff" role="img"></span></div>
  <div class="production-pair production-next"><strong>Next</strong><span id="production-next-buff" class="production-buff" role="img"></span><span id="production-next-debuff" class="production-debuff" role="img"></span></div>
  <span id="production-countdown"></span>
  <progress id="production-progress" max="45000" aria-label="Time until next production pair"></progress>
</div>
<div id="msg"></div>
<svg id="map" viewBox="-4 -4 108 112"></svg>
<div class="card" id="panel"></div>

<details id="friends-panel" class="card"><summary id="friend-summary" aria-label="Player profile and friends" title="Player profile"><svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.3-6 8-6s7.5 2 8 6"/></svg></summary><section class="card" id="lobby" aria-label="Online lobby">
  <div class="profile-name-row"><strong id="profile-name"></strong><button type="button" id="edit-profile-name" aria-label="Edit your name" title="Edit name">✎</button></div>
  <form class="row" hidden><label for="display-name">Your name</label>
    <input id="display-name" name="name" required maxlength="32" autocomplete="nickname">
    <button>Save</button>
  </form>
  <p role="status">Connecting to players…</p>
  <strong>Online players</strong><ul id="friends"></ul>
</section></details><div id="invite-toasts" aria-live="assertive"></div></main>
<script src="./production-cycle.js?v=21"></script><script>
const CONFIG={timeScale:1,castleRate:2,outpostRate:3,cooldown:5,travel:2,holdMs:420,strengthEpsilon:1e-8,departureInterval:0.25,neutralGarrison:5,castleStart:6,aiInterval:3,cap:99,mult:[1,2,1.5,1,1,0.67,0.5]};
const T=[["🍎","apple"],["🍊","orange"],["🍌","banana"],["🥑","avocado"],["🫐","blueberry"],["🍇","plum"],["🥥","coconut"]];
const POS={P2:[50,5],P1:[50,95],A1:[28,22],A2:[50,22],A3:[72,22],B1:[12,50],B2:[38,50],B3:[62,50],B4:[88,50],C1:[28,78],C2:[50,78],C3:[72,78]};
// Threefold symmetric graph: castles, triangle side nodes, vertices, and hub.
// Twin branches follows the ten-node two-player sketch.
// Axis-symmetric four-player schema; every castle pair is four edges apart.
const FOUR_POS={P1:[25,8],P2:[75,8],P3:[25,92],P4:[75,92],D1:[50,18],D2:[50,82],A1:[12,32],A2:[38,32],A3:[62,32],A4:[88,32],B1:[12,50],B2:[50,50],B3:[88,50],C1:[12,68],C2:[38,68],C3:[62,68],C4:[88,68]};
const FOUR_EDGES="P1-A1 P1-A2 P2-A3 P2-A4 P3-C1 P3-C2 P4-C3 P4-C4 A1-A2 A3-A4 C1-C2 C3-C4 D1-A2 D1-A3 D2-C2 D2-C3 A2-B2 A3-B2 C2-B2 C3-B2 A1-B1 B1-C1 A4-B3 B3-C4 B1-B2 B2-B3".split(" ").map(e=>e.split("-"));
const BRANCH_POS={P2:[50,6],A1:[20,28],A2:[50,28],A3:[80,28],B1:[35,50],B2:[65,50],C1:[20,72],C2:[50,72],C3:[80,72],P1:[50,94]};
const BRANCH_EDGES="P2-A1 P2-A3 A1-A2 A2-A3 A1-B1 A2-B1 A2-B2 A3-B2 B1-C1 B1-C2 B2-C2 B2-C3 C1-C2 C2-C3 C1-P1 C3-P1".split(" ").map(e=>e.split("-"));
const THREE_POS={P1:[50,96],P2:[89.8371685741,27],P3:[10.1628314259,27],C2:[50,72],A1:[30.9474411167,39],A3:[69.0525588833,39],A2:[50,12],C1:[17.0910346562,69],C3:[82.9089653438,69],B2:[50,50]};
const THREE_EDGES="P1-C2 P2-A3 P3-A1 A2-A1 A2-A3 C1-A1 C1-C2 C3-A3 C3-C2 B2-A1 B2-A3 B2-C2".split(" ").map(e=>e.split("-"));
const rotateBoardPoint=(p,angle)=>({x:50+(p.x-50)*Math.cos(angle)-(p.y-50)*Math.sin(angle),y:50+(p.x-50)*Math.sin(angle)+(p.y-50)*Math.cos(angle)});
const shopPosition=(c,kind,triangular,four=false)=>four?{x:c.x+(kind==="shield"?-15:15),y:c.y<50?2:98}:triangular?rotateBoardPoint({x:kind==="shield"?26:74,y:90},(Number(c.id.slice(1))-1)*2*Math.PI/3):{x:Math.max(8,Math.min(92,c.x+(kind==="shield"?-36:36))),y:c.y+5};
const EDGES="P2-A1 P2-A2 P2-A3 A1-A2 A2-A3 A1-B1 A1-B2 A2-B2 A2-B3 A3-B3 A3-B4 B1-B2 B2-B3 B3-B4 B1-C1 B2-C1 B2-C2 B3-C2 B3-C3 B4-C3 C1-C2 C2-C3 C1-P1 C2-P1 C3-P1".split(" ").map(e=>e.split("-"));
let productionCycle;
let N,G,drag,sel,sendType,half,msg,over,aiT;
const $=id=>document.getElementById(id);
let botConfig={map:1,speed:1,shops:false,productionRotation:false,noQueue:false,transformationWave:false,transformationTime:10};
const extraMaps={
  1:{nodes:{},edges:[]},
  2:{nodes:{D1:[18,34],D2:[82,34],E1:[28,64],E2:[72,64]},edges:[["A1","D1"],["A3","D2"],["B2","E1"],["B3","E2"],["D1","B1"],["D2","B4"],["E1","C1"],["E2","C3"]]},
  3:{nodes:{P3:[92,50],A4:[71,36],B5:[78,65],C4:[48,56]},edges:[["P3","A3"],["P3","B4"],["P3","C3"],["A3","A4"],["B4","A4"],["B4","B5"],["C3","B5"],["B5","C4"],["C4","C2"]]},
  4:{nodes:{P3:[92,50],P4:[8,50],A4:[70,28],A5:[70,72],B5:[50,36],B6:[50,64],C4:[29,28],C5:[29,72]},edges:[["P3","A3"],["P3","A4"],["P3","B5"],["P4","A1"],["P4","C1"],["P4","C4"],["A4","B5"],["B5","B2"],["B5","B3"],["A5","B6"],["A5","C3"],["A5","C5"],["B6","B2"],["B6","C2"],["C4","B1"],["C5","B4"]]}
};
function init(){
  transformationClock=0;
  N={};
  CONFIG.timeScale=botConfig.speed;
  const positions=botConfig.map===4?FOUR_POS:botConfig.map===5?BRANCH_POS:botConfig.map===3?THREE_POS:{...POS,...extraMaps[botConfig.map].nodes};
  for(const [id,[x,y]] of Object.entries(positions))N[id]={id,x,y,castle:id[0]==="P",owner:0,stock:Array(7).fill(0),ut:0,pend:null,cd:0,tm:0,q:[],orders:[],departure:0,adj:[]};
  const edges=botConfig.map===4?FOUR_EDGES:botConfig.map===5?BRANCH_EDGES:botConfig.map===3?THREE_EDGES:[...EDGES,...extraMaps[botConfig.map].edges];
  if(botConfig.shops)for(const owner of Object.values(N).filter(n=>n.castle).map(n=>Number(n.id.slice(1))))for(const kind of ["shield","boost"]){const id=`S${owner}${kind==="shield"?"H":"B"}`,c=N[`P${owner}`];N[id]={id,...shopPosition(c,kind,botConfig.map===3,botConfig.map===4),castle:false,shop:kind,owner,stock:Array(7).fill(0),ut:0,pend:null,cd:0,tm:0,q:[],orders:[],departure:0,adj:[],charge:0,abilityReady:false,abilityCd:0,abilityTargets:[]};c.adj.push(id);N[id].abilityTargets=Object.keys(positions)}
  edges.forEach(([a,b])=>{N[a].adj.push(b);N[b].adj.push(a)});
  for(const n of Object.values(N)){if(n.shop)continue;const ty=Math.random()*7|0;
    if(n.castle){n.owner=Number(n.id.slice(1));n.stock[ty]=CONFIG.castleStart}else{n.ut=ty;n.stock[ty]=CONFIG.neutralGarrison}}
  G=[];drag=null;sel=null;sendType=0;half=false;over=0;aiT=2;
  productionCycle=botConfig.productionRotation?startProductionCycle(N,G,T.length,performance.now()):null;
  msg="Queue units in your castle (bottom). Then drag from the castle to a connected outpost.";
}
const mult=(a,d)=>CONFIG.mult[((d-a)%7+7)%7];
const big=n=>{let b=-1,m=0;n.stock.forEach((c,i)=>{if(c>m){m=c;b=i}});return b};
const tot=n=>n.stock.reduce((a,b)=>a+b,0);

const vis=()=>{if(N.P1.disabled)return new Set(Object.keys(N));const s=new Set();for(const n of Object.values(N))if(n.owner===1){s.add(n.id);n.adj.forEach(x=>s.add(x))}return s};
function fight(at,an,dt,dn){
  const pa=an*mult(at,dt),pd=dn*mult(dt,at);
  if(pa-pd>CONFIG.strengthEpsilon)return[1,(pa-pd)/mult(at,dt)];
  if(pd-pa>CONFIG.strengthEpsilon)return[2,(pd-pa)/mult(dt,at)];
  return[0,0];
}
function shopCapacity(target,includeOrders=true){
  const incoming=G.filter(g=>g.to===target.id&&g.owner===target.owner).reduce((sum,g)=>sum+g.n,0);
  const queued=includeOrders?Object.values(N).reduce((sum,n)=>sum+n.orders.filter(o=>o.to===target.id&&o.owner===target.owner).reduce((total,o)=>total+o.count,0),0):0;
  return target.abilityReady||target.abilityCd>0?0:Math.max(0,10-target.charge-incoming-queued);
}
function canEnter(target,owner,type){
  if(!target||target.disabled)return false;
  if(target.shop)return target.owner===owner&&shopCapacity(target,false)>CONFIG.strengthEpsilon;
  return target.owner!==owner||queuedCastle(target)||target.ut===type;
}
function dispatch(source,to,type,count){
  const target=N[to];
  if(target?.shop){if(target.owner!==source.owner)return;count=Math.min(count,shopCapacity(target));}
  if(count<=CONFIG.strengthEpsilon)return;
  source.stock[type]-=count;
  source.orders.push({to,owner:source.owner,type,count});
}
function depart(source,dt){
  source.departure=Math.max(0,source.departure-dt);
  if(source.departure>0)return;
  while(source.orders.length){
    const order=source.orders[0],target=N[order.to];
    if(!canEnter(target,order.owner,order.type)){
      if(source.castle||source.ut===order.type)source.stock[order.type]+=order.count;
      source.orders.shift();
      continue;
    }
    const strength=Math.min(1,order.count,target.shop?shopCapacity(target,false):Infinity);
    G.push({from:source.id,to:order.to,owner:order.owner,type:order.type,n:strength,t:0});
    order.count-=strength;
    if(order.count<=CONFIG.strengthEpsilon)source.orders.shift();
    source.departure=CONFIG.departureInterval;
    return;
  }
}
function arrive(g){
  const n=N[g.to];
  if(n.shop){if(g.owner===n.owner&&!n.abilityReady&&n.abilityCd<=0){n.charge=Math.min(10,n.charge+Math.ceil(g.n));if(n.charge>=10)n.abilityReady=true}return}
  if(n.owner===g.owner){if(!canEnter(n,g.owner,g.type))return;n.stock[g.type]=Math.min(CONFIG.cap,n.stock[g.type]+Math.ceil(g.n));return}
  let a=g.n;
  while(a>0){
    const d=big(n);if(d<0)break;
    const[w,r]=fight(g.type,a,d,n.stock[d]);
    if(w===1){n.stock[d]=0;a=r}else if(w===2){n.stock[d]=r;a=0}else{n.stock[d]=0;a=0}
  }
  if(a>0){
    if(n.castle){over=g.owner;return}
    n.owner=g.owner;n.orders=[];n.departure=0;n.stock.fill(0);n.stock[g.type]=Math.ceil(a);n.ut=g.type;n.pend=null;n.cd=0;n.tm=0;
    if(g.owner!==1&&sel===n.id)sel=null;
  }
}
function step(dt){
  if(over)return;
  transformationClock+=dt;
  for(const n of Object.values(N)){
    if(!n.owner)continue;
    if(n.shop){if(n.abilityCd>0)n.abilityCd=Math.max(0,n.abilityCd-dt);continue}
    if(queuedCastle(n)){if(n.q.length){n.tm+=dt*productionMultiplier(productionCycle,n.q[0]);if(n.tm>=CONFIG.castleRate){n.tm=0;n.stock[n.q.shift()]++}}}
    else if(n.cd>0){advanceTransformation(n,dt);if(n.cd<=0){n.cd=0;const o=tot(n);n.stock.fill(0);n.stock[n.pend]=o;n.ut=n.pend;n.pend=null}}
    else{n.tm+=dt*productionMultiplier(productionCycle,n.ut);if(n.tm>=CONFIG.outpostRate){n.tm=0;if(tot(n)<CONFIG.cap)n.stock[n.ut]++}}
  }
  G.forEach(g=>{g.previous=g.t;g.t+=dt/CONFIG.travel});
  for(const a of G)for(const b of G){
    if(a===b||a.dead||b.dead||a.owner===b.owner||a.from!==b.to||a.to!==b.from||a.previous+b.previous>=1||a.t+b.t<1)continue;
    const[w,r]=fight(a.type,a.n,b.type,b.n);
    if(w===1){a.n=r;b.dead=1}else if(w===2){b.n=r;a.dead=1}else{a.dead=b.dead=1}
  }
  G=G.filter(g=>!g.dead);
  const done=G.filter(g=>g.t>=1);G=G.filter(g=>g.t<1);for(const g of done){arrive(g);if(over)return}
  for(const n of Object.values(N))depart(n,dt);
  aiT-=dt;if(aiT<=0){aiT=CONFIG.aiInterval;ai()}
}
function ai(){
  for(const owner of [2,3,4]){
  const castle=N[`P${owner}`];if(!castle||castle.disabled)continue;botShopTurn(owner);const q=castle.q;while(!noQueueMode()&&q.length<3)q.push(Math.random()*7|0);
  const mine=Object.values(N).filter(n=>n.owner===owner&&big(n)>=0).sort(()=>Math.random()-.5).slice(0,2);
  for(const n of mine){
    const ty=big(n),c=n.stock[ty],amt=n.castle?c-2:c;
    if(amt<3)continue;
    let best=null,bs=0;
    for(const id of n.adj){
      const t=N[id];let s;
      if(t.owner===owner||t.shop){if(t.shop||!t.castle&&t.ut!==ty)continue;s=Math.random()<.3?1.1:0}
      else{const d=big(t);s=d<0?99:amt*mult(ty,d)/(t.stock[d]*mult(d,ty));s*=1+Math.random()*.4}
      if(s>bs){bs=s;best=id}
    }
    if(best&&bs>1)dispatch(n,best,ty,amt);
  }
  }
}
function select(id){
  if(sel===id)return;
  sel=id;
  sendType=Math.max(0,big(N[id]));
}
function send(from,to){
  const source=N[from],target=N[to];
  if(over||source.owner!==1||!source.adj.includes(to))return;
  const count=source.stock[sendType];
  if(!canEnter(target,1,sendType)){
    msg="Friendly outposts only accept their current fruit type.";
  }else if(!count){
    msg="No "+T[sendType][1]+"s to send. Pick another type below.";
  }else{
    dispatch(source,to,sendType,half?Math.min(count,Math.max(1,Math.floor(count/2))):count);
    msg="";
  }
}
function pick(id){
  if(over)return;
  if(N[id].owner===1)select(id);
  else sel=null;
}
function act(a){
  if(a==="restart")return init();
  if(a==="qc")N.P1.q=[];
  else if(a==="half")half=!half;
  else if(a[0]==="q"){if(!noQueueMode()&&N.P1.q.length<20)N.P1.q.push(+a[1])}
  else if(a[0]==="s")sendType=+a[1];
  else if(a[0]==="p"){const n=N[sel],i=+a[1];if(n&&n.owner===1&&!queuedCastle(n)&&!n.shop&&i!==(n.pend??n.ut)){beginTransformation(n,i)}}
}
function render(){
  const V=vis();let h="";
  for(const[a,b]of EDGES){const A=N[a],B=N[b],on=V.has(a)||V.has(b);
    h+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--edge)" stroke-width="${on?.7:.3}" opacity="${on?1:.4}"/>`}
  for(const n of Object.values(N)){
    const v=V.has(n.id),r=n.castle?6.5:5.2,tg=sel&&N[sel].adj.includes(n.id);
    const col=!v||!n.owner?"var(--neu)":n.owner===1?"var(--p1)":"var(--p2)";
    const k=big(n),face=!v?"?":n.castle?"🏰":n.cd>0?"⏳":T[k>=0?k:n.ut][0];
    h+=`<g data-id="${n.id}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${col}" fill-opacity="${v?.9:.3}" stroke="${n.id===sel?"var(--fg)":"var(--mut)"}" stroke-width="${n.id===sel?1.3:.4}"/>`;
    if(tg&&canEnter(n,1,sendType)){
      let color="var(--fg)",mark="";
      if(v&&n.owner!==1&&k>=0&&N[sel].stock[sendType]>0){
        const attack=mult(sendType,k),defense=mult(k,sendType);
        color=attack>defense?"#29945d":attack<defense?"var(--p2)":"var(--mut)";
        mark=attack>defense?"+":attack<defense?"−":"=";
      }
      h+=`<circle cx="${n.x}" cy="${n.y}" r="${r+1.6}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="1.5 1"/>`;
      if(mark)h+=`<text x="${n.x+r+2}" y="${n.y-r}" text-anchor="middle" font-size="5" font-weight="bold" fill="${color}">${mark}</text>`;
    }
    h+=`<text x="${n.x}" y="${n.y}" text-anchor="middle" dominant-baseline="central" font-size="${n.castle?6:5.4}" fill="var(--fg)">${face}</text>`;
    if(v)h+=`<text x="${n.x}" y="${n.y+r+3.4}" text-anchor="middle" font-size="3.4" font-weight="600" fill="var(--fg)">${n.stock.reduce((count,strength)=>count+Math.ceil(strength),0)}${n.castle&&n.owner===1?" 🏰":""}</text>`;
    h+="</g>";
  }
  if(drag?.moved){
    const source=N[drag.from];
    const end=new DOMPoint(drag.x,drag.y).matrixTransform($("map").getScreenCTM().inverse());
    h+=`<line pointer-events="none" x1="${source.x}" y1="${source.y}" x2="${end.x}" y2="${end.y}" stroke="var(--p1)" stroke-width="1" stroke-dasharray="2 1"/>`;
  }
  for(const g of G){
    const A=N[g.from],B=N[g.to];
    if(g.owner!==1&&!V.has(g.from)&&!V.has(g.to))continue;
    const x=A.x+(B.x-A.x)*g.t,y=A.y+(B.y-A.y)*g.t;
    h+=`<g pointer-events="none"><circle cx="${x}" cy="${y}" r="1.6" fill-opacity="${.4+.6*g.n}" fill="${g.owner===1?"var(--p1)":"var(--p2)"}" stroke="var(--fg)" stroke-width=".3"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="2.5">${T[g.type][0]}</text></g>`;
  }
  $("map").innerHTML=h;
}
function panel(){
  $("msg").innerHTML=over?(over===1?"🏆 You captured the enemy castle. ":"💀 Your castle fell. ")+`<button data-act="restart">Play again</button>`:msg;
  const c=N.P1;
  let h=noQueueMode()?'':`<div class="row"><b>Castle queue</b>`+T.map((t,i)=>`<button data-act="q${i}">${t[0]}</button>`).join("")+`<button data-act="qc">Clear</button></div><div class="row"><small>${c.q.length?"Building: "+c.q.map(i=>T[i][0]).join(" "):"Queue is empty. Tap a fruit to add it."}</small></div>`;
  if(sel){
    const n=N[sel];
    h+=`<div class="row"><b>${n.castle?"Castle":"Outpost "+n.id}</b> Send:`+n.stock.map((k,i)=>k?`<button class="${i===sendType?"on":""}" data-act="s${i}">${T[i][0]} ${Math.ceil(k)}</button>`:"").join("")+`<button data-act="half">${half?"Half":"All"}</button></div>`;
    if(!n.castle)h+=`<div class="row">Produce:`+T.map((t,i)=>`<button class="${(n.pend??n.ut)===i?"on":""}" data-act="p${i}">${t[0]}</button>`).join("")+(n.cd>0?` <small>switching in ${n.cd.toFixed(1)}s</small>`:"")+`</div>`;
  }
  $("panel").innerHTML=h;
}
let last=performance.now(),pl=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1e3)*CONFIG.timeScale;last=now;
  if(productionCycle&&!over)advanceProductionCycle(productionCycle,N,G,T.length,now);
  step(dt);render();
  renderProductionCycle(productionCycle,T);
  if(now-pl>150){pl=now;panel()}
  requestAnimationFrame(loop);
}
addEventListener("click",e=>{
  const button=e.target.closest("[data-act]");
  if(button){act(button.dataset.act);pl=0}
});
const map=$("map");
const typeWheel=document.createElement("div");
typeWheel.className="type-wheel";
typeWheel.hidden=true;
typeWheel.setAttribute("role","group");
typeWheel.setAttribute("aria-label","Choose outpost production type");
document.body.append(typeWheel);
let holdTimer;
function closeWheel(){typeWheel.hidden=true}
function openWheel(id,x,y){
  const node=N[id];
  if(over||!node||node.castle||node.owner!==1)return;
  select(id);
  drag.held=true;
  const label=document.createElement("span");
  label.textContent="Produce";
  typeWheel.replaceChildren(label);
  for(const [i,[icon,name]] of T.entries()){
    const button=document.createElement("button");
    const angle=2*Math.PI*i/T.length-Math.PI/2;
    button.style.left=102+75*Math.cos(angle)+"px";
    button.style.top=102+75*Math.sin(angle)+"px";
    button.textContent=icon;
    button.setAttribute("aria-label","Produce "+name);
    if((node.pend??node.ut)===i)button.className="on";
    button.onclick=()=>{
      if(sel===id&&N[id].owner===1)act("p"+i);
      closeWheel();
      pl=0;
    };
    typeWheel.append(button);
  }
  typeWheel.style.left=Math.max(0,Math.min(innerWidth-208,x-104))+"px";
  typeWheel.style.top=Math.max(0,Math.min(innerHeight-208,y-104))+"px";
  typeWheel.hidden=false;
  pl=0;
}
init();requestAnimationFrame(loop);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.error);
