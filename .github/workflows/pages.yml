name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Test game startup and commands
        run: node --test tests/*.test.cjs
      - name: Build SpacetimeDB lobby client
        run: |
          npm --prefix spacetime-lobby ci
          npm --prefix spacetime-lobby run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage game
        env:
          FRUIT_WARS_LOBBY: ${{ vars.FRUIT_WARS_LOBBY }}
          FRUIT_WARS_TURN_ENDPOINT: ${{ vars.FRUIT_WARS_TURN_ENDPOINT }}
          FRUIT_WARS_SPACETIME_DB: ${{ vars.FRUIT_WARS_SPACETIME_DB || 'fruit-wars-kjhunkler-lobby' }}
          FRUIT_WARS_AUTH_CLIENT: ${{ vars.FRUIT_WARS_AUTH_CLIENT || 'client_034zmHlYcVP9MRHOv8rieo' }}
        run: |
          mkdir site
          cp index.html orchard.html signal.html match.html editions.css board-ui.css board-ui.js bot-ai.js controls.js simulation.js duel-maps.js map-library.js manifest.webmanifest sw.js icon-192.png icon-512.png lobby.js public-lobby.js site/
          cp spacetime-lobby/dist/spacetime-lobby-client.js site/
          node -e 'const values = ["FRUIT_WARS_LOBBY", "FRUIT_WARS_TURN_ENDPOINT", "FRUIT_WARS_SPACETIME_DB", "FRUIT_WARS_AUTH_CLIENT"]; require("node:fs").writeFileSync("site/lobby-config.js", values.map(key => "window." + key + " = " + JSON.stringify(process.env[key] === "off" && values.indexOf(key) >= 2 ? "" : process.env[key] || "") + ";\n").join(""))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
