name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage game
        env:
          FRUIT_WARS_LOBBY: ${{ vars.FRUIT_WARS_LOBBY }}
        run: |
          mkdir site
          cp index.html orchard.html signal.html match.html editions.css board-ui.css board-ui.js manifest.webmanifest sw.js icon-192.png icon-512.png lobby.js public-lobby.js site/
          node -e 'require("node:fs").writeFileSync("site/lobby-config.js", "window.FRUIT_WARS_LOBBY = " + JSON.stringify(process.env.FRUIT_WARS_LOBBY || "") + ";\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
